# 单项目代码 RAG — 配置
#
# 阶段 0 第一版只填三样：项目路径、语言映射、最保守的排除规则。
# 跑 `python scripts/0_stats.py` 看统计 → 回来补排除规则 → 再跑。
# 排除规则是做减法，减法做过了会静默丢东西：先排少，让污染暴露出来再精准打击。

project:
  root: "/Users/wangly/Documents/互动系统/tmagic-editor-feature-init"              # TODO 改成你的项目绝对路径
  name: "my-project"     # chunk 里保留 project 字段（单值，成本为零），将来加第二个项目零改动

languages:
  # 扩展名 -> tree-sitter 语言名
  py: python
  js: javascript
  jsx: javascript
  ts: typescript
  tsx: tsx
  go: go
  java: java
  rs: rust
  rb: ruby

exclude:
  # 第一层：目录名
  dirs:
    - node_modules
    - .git
    - dist
    - build
    - .venv
    - venv
    - __pycache__
    - .next
    - target
    - coverage
    - vue3
    - assets
    - hx-sdk
    - designs
    - .tmagic
  # 第二层：文件名模式
  patterns:
    - "*.min.js"
    - "*.lock"
    - "*.pb.go"
    - "*.generated.*"
    - "*.d.ts"
  # 第三层：内容标记（只扫前 30 行）—— 最容易漏、污染最重。
  # 很多生成文件叫 api_client.ts / models.py，从名字完全看不出来。
  content_markers:
    - "DO NOT EDIT"
    - "Code generated by"
    - "@generated"
    - "AUTOGENERATED"
  scan_head_lines: 30
  max_file_bytes: 1048576   # 1MB 体积兜底
  exclude_tests: false      # 测试名/断言是最精准的语义描述，建议进索引

chunking:
  units: [module, class, function, method]
  max_lines: 150            # 超过则按嵌套函数再切一层，保住面包屑
  breadcrumb_sep: " › "
  embed_breadcrumb: true    # 面包屑拼进 embedding 输入 —— 所有优化里性价比最高的一项

# 单项目场景「这函数被谁调用」是最高频问题之一，调用关系是确定性事实，
# 靠向量答不准，必须在解析层抽出来存表。
extract_calls: true

embedding:
  provider: local           # local | api
  model: BAAI/bge-m3        # 或 Qwen/Qwen3-Embedding-4B
  # provider: api 时改用 voyage-code / Qwen text-embedding-v4
  # model: voyage-code
  dimension: null           # 别手填，首次运行自动探测后回写
  batch_size: 32

store:
  backend: sqlite           # sqlite | qdrant（>100 万 chunk 才考虑换）
  path: data/index.db
  fts_tokenizer: "unicode61 remove_diacritics 2"   # 中文注释多的项目需另行分词

retrieval:
  top_k: 5
  rrf_k: 60                 # RRF，不调权重
  filters:                  # 单项目的过滤维度是 目录/模块/语言/修改时间，不是 project
    dir: null               # 例：src/service
    language: null
    modified_within_days: null

generation:
  provider: null            # openai | anthropic | ollama | vllm
  model: null
  cite_sources: true
  fallback_text: "片段里没有依据，不要猜。"

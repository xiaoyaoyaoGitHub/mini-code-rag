project:
  root: /Users/wangly/Documents/互动系统/tmagic-editor-feature-init
  name: my-project
languages:
  py: python
  js: javascript
  jsx: javascript
  ts: typescript
  tsx: tsx
  go: go
  java: java
  rs: rust
  rb: ruby
exclude:
  dirs:
  - node_modules
  - .git
  - dist
  - build
  - .venv
  - venv
  - __pycache__
  - .next
  - target
  - coverage
  - vue3
  - assets
  - hx-sdk
  - designs
  - .tmagic
  patterns:
  - '*.min.js'
  - '*.lock'
  - '*.pb.go'
  - '*.generated.*'
  - '*.d.ts'
  content_markers:
  - DO NOT EDIT
  - Code generated by
  - '@generated'
  - AUTOGENERATED
  scan_head_lines: 30
  max_file_bytes: 1048576
  exclude_tests: false
chunking:
  units:
  - module
  - class
  - function
  - method
  max_lines: 150
  breadcrumb_sep: ' › '
  embed_breadcrumb: true
extract_calls: true
embedding:
  provider: API
  model: text-embedding-v4
  dimension: 1024
  batch_size: 25
store:
  backend: sqlite
  path: data/index.db
  fts_tokenizer: unicode61 remove_diacritics 2
  path_jsonl: data/chunks.jsonl
retrieval:
  top_k: 5
  rrf_k: 60
  filters:
    dir: null
    language: null
    modified_within_days: null
generation:
  provider: null
  model: null
  cite_sources: true
  fallback_text: 片段里没有依据，不要猜。

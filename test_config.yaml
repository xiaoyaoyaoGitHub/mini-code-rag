project:
  root: /Users/wangly/Documents/study/pythons/code-embedding/tutorial/toy_repo
  name: toy_repo
languages:
  py: python
exclude:
  dirs:
  - generated
  - __pycache__
  - .git
  - node_modules
  - .venv
  patterns:
  - '*.min.js'
  - '*.generated.*'
  content_markers:
  - DO NOT EDIT
  - Code generated by
  - '@generated'
  - AUTOGENERATED
  scan_head_lines: 30
  max_file_bytes: 1048576
  exclude_tests: false
chunking:
  units:
  - module
  - class
  - function
  - method
  max_lines: 150
  breadcrumb_sep: ' › '
  embed_breadcrumb: true
extract_calls: true
embedding:
  provider: local
  model: all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
store:
  backend: sqlite
  path: data/test_index.db
  fts_tokenizer: unicode61 remove_diacritics 2
retrieval:
  top_k: 5
  rrf_k: 60
  filters:
    dir: null
    language: null
    modified_within_days: null
generation:
  provider: null
  model: null
  cite_sources: true
  fallback_text: 片段里没有找到依据，无法回答。
